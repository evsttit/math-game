<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Математический тренажер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: #1e293b;
            border-radius: 48px;
            padding: 30px 25px 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid #334155;
        }

        /* --- ШАПКА --- */
        .header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .music-controls {
            display: flex;
            gap: 8px;
        }

        .music-btn {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.2s;
            color: #94a3b8;
        }

        .music-btn:hover {
            background: #1e293b;
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .level-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .level-btn {
            flex: 1;
            min-width: 50px;
            padding: 10px 6px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .level-btn img {
            width: 18px;
            height: 18px;
            filter: brightness(0) saturate(100%) invert(60%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(90%);
            transition: filter 0.2s;
        }
        .level-btn.active img {
            filter: brightness(0) saturate(100%) invert(100%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(100%);
        }

        .level-btn:hover {
            background: #1e293b;
            border-color: #475569;
        }

        .level-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .stats-row .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-row .stat-item img {
            width: 24px;
            height: 24px;
            filter: brightness(0) saturate(100%) invert(70%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(90%);
        }
        .stats-row .stat-value {
            color: #facc15;
            background: #2d3748;
            padding: 2px 14px;
            border-radius: 100px;
            font-weight: 700;
        }

        .expression-area {
            background: #0f172a;
            border-radius: 32px;
            padding: 35px 20px;
            margin-bottom: 24px;
            text-align: center;
            border: 2px solid #334155;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #expression {
            font-size: 3.2rem;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #answerInput {
            width: 100%;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 20px;
            padding: 18px 24px;
            font-size: 2rem;
            font-weight: 600;
            color: #e2e8f0;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        #answerInput::-webkit-outer-spin-button,
        #answerInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #answerInput:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        #answerInput.error {
            border-color: #ef4444;
            background: #450a0a;
            animation: shake 0.2s ease-in-out;
        }

        #answerInput.success {
            border-color: #22c55e;
            background: #052e16;
        }

        .hint {
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
        }

        .records-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .records-header .title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .records-header .title img {
            width: 24px;
            height: 24px;
            filter: brightness(0) saturate(100%) invert(70%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(100%) contrast(90%);
        }

        #clearRecordsBtn {
            background: none;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        #clearRecordsBtn:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .records-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .record-item {
            background: #0f172a;
            padding: 10px 6px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #334155;
        }

        .record-level {
            color: #94a3b8;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .record-score {
            color: #facc15;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .record-empty {
            color: #475569;
            font-size: 0.8rem;
            grid-column: 1 / -1;
            text-align: center;
            padding: 12px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        @media (max-width: 480px) {
            .game-container { padding: 20px 16px 25px; border-radius: 32px; }
            #expression { font-size: 2.4rem; }
            #answerInput { font-size: 1.6rem; padding: 14px 18px; }
            .level-btn { font-size: 0.75rem; padding: 8px 4px; min-width: 40px; }
            .level-btn img { width: 14px; height: 14px; }
            .record-item { padding: 8px 4px; }
            .record-score { font-size: 1.1rem; }
            .stats-row .stat-item img { width: 20px; height: 20px; }
            .music-btn { width: 38px; height: 38px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="game-container">

    <div class="header">
        <!-- Верхняя строка с кнопками управления музыкой -->
        <div class="top-row">
            <div class="level-selector" id="levelSelector">
                <button class="level-btn active" data-level="1">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="star"> 1
                </button>
                <button class="level-btn" data-level="2">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="star"> 2
                </button>
                <button class="level-btn" data-level="3">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="star"> 3
                </button>
                <button class="level-btn" data-level="4">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="star"> 4
                </button>
                <button class="level-btn" data-level="5">
                    <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" alt="star"> 5
                </button>
            </div>
            <div class="music-controls">
                <button class="music-btn" id="playMusicBtn" title="Включить музыку">🔇</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <img src="https://cdn-icons-png.flaticon.com/128/14090/14090371.png" alt="correct">
                <span>Правильно подряд</span>
            </div>
            <span class="stat-value" id="streakDisplay">0</span>
        </div>
    </div>

    <div class="expression-area">
        <div id="expression">1 + 2</div>
    </div>

    <div class="input-area">
        <input type="number" id="answerInput" placeholder="Введите ответ" autofocus inputmode="numeric">
        <div class="hint">Нажмите Enter для проверки</div>
    </div>

    <div class="records-section">
        <div class="records-header">
            <span class="title">
                <img src="https://cdn-icons-png.flaticon.com/128/7960/7960328.png" alt="trophy">
                Рекорды
            </span>
            <button id="clearRecordsBtn">Очистить</button>
        </div>
        <div class="records-grid" id="recordsGrid">
            <div class="record-empty">Нет рекордов. Сыграйте!</div>
        </div>
    </div>

</div>

<script>
    (function(){
        "use strict";

        const expressionEl = document.getElementById('expression');
        const answerInput = document.getElementById('answerInput');
        const streakDisplay = document.getElementById('streakDisplay');
        const recordsGrid = document.getElementById('recordsGrid');
        const clearRecordsBtn = document.getElementById('clearRecordsBtn');
        const levelButtons = document.querySelectorAll('.level-btn');
        const playMusicBtn = document.getElementById('playMusicBtn');

        let currentLevel = 1;
        let correctStreak = 0;
        let currentAnswer = 0;
        let isLocked = false;

        // --- МУЗЫКА ---
        let audio = null;
        let isMusicPlaying = false;

        function initAudio() {
            if (audio) return;
            audio = new Audio();
            audio.loop = true;
            // Ссылка на музыкальный файл (можно заменить на свою)
            // Используем бесплатный трек из интернета
            audio.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
            audio.volume = 0.3;

            // Автовоспроизведение после любого взаимодействия с игрой
            audio.addEventListener('canplaythrough', function() {
                if (isMusicPlaying) {
                    audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
                }
            });
        }

        function toggleMusic() {
            initAudio();
            
            if (isMusicPlaying) {
                // Выключаем музыку
                audio.pause();
                isMusicPlaying = false;
                playMusicBtn.textContent = '🔇';
            } else {
                // Включаем музыку
                audio.play().catch(e => {
                    console.log('Не удалось воспроизвести музыку:', e);
                });
                isMusicPlaying = true;
                playMusicBtn.textContent = '🔊';
            }
        }

        // При первом клике в любом месте игры пробуем включить музыку
        function tryAutoPlay() {
            if (!audio) {
                initAudio();
                // Пытаемся включить музыку при первом взаимодействии
                if (!isMusicPlaying) {
                    audio.play().then(() => {
                        isMusicPlaying = true;
                        playMusicBtn.textContent = '🔊';
                    }).catch(e => {
                        console.log('Для включения музыки нажмите кнопку');
                    });
                }
            }
        }

        // --- РЕКОРДЫ ---
        function loadRecords() {
            try {
                const data = localStorage.getItem('mathGameRecords');
                return data ? JSON.parse(data) : {};
            } catch { return {}; }
        }

        function saveRecords(records) {
            localStorage.setItem('mathGameRecords', JSON.stringify(records));
        }

        function updateRecordsDisplay() {
            const records = loadRecords();
            const levels = [1, 2, 3, 4, 5];
            let html = '';
            let hasRecords = false;

            for (const lvl of levels) {
                const score = records[lvl] || 0;
                if (score > 0) hasRecords = true;
                html += `
                    <div class="record-item">
                        <div class="record-level">Уровень ${lvl}</div>
                        <div class="record-score">${score}</div>
                    </div>
                `;
            }

            recordsGrid.innerHTML = hasRecords ? html : `<div class="record-empty">Нет рекордов. Сыграйте!</div>`;
        }

        function updateRecord(level, streak) {
            const records = loadRecords();
            if (!records[level] || streak > records[level]) {
                records[level] = streak;
                saveRecords(records);
                updateRecordsDisplay();
            }
        }

        function generateExpression(level) {
            let a, b, c, expression, answer;
            const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            switch(level) {
                case 1:
                    a = rand(1, 10); b = rand(1, 10);
                    if (Math.random() > 0.5) {
                        expression = `${a} + ${b}`;
                        answer = a + b;
                    } else {
                        a = rand(5, 15); b = rand(1, a);
                        expression = `${a} - ${b}`;
                        answer = a - b;
                    }
                    break;
                case 2:
                    a = rand(2, 9); b = rand(2, 9);
                    if (Math.random() > 0.5) {
                        expression = `${a} × ${b}`;
                        answer = a * b;
                    } else {
                        b = rand(2, 9);
                        a = b * rand(1, 8);
                        expression = `${a} ÷ ${b}`;
                        answer = a / b;
                    }
                    break;
                case 3:
                    a = rand(2, 9); b = rand(2, 9); c = rand(2, 6);
                    if (Math.random() > 0.5) {
                        expression = `${a} + ${b} × ${c}`;
                        answer = a + (b * c);
                    } else {
                        expression = `${a} × ${b} - ${c}`;
                        answer = (a * b) - c;
                    }
                    break;
                case 4:
                    a = rand(2, 8); b = rand(2, 8); c = rand(2, 5);
                    if (Math.random() > 0.5) {
                        expression = `(${a} + ${b}) × ${c}`;
                        answer = (a + b) * c;
                    } else {
                        expression = `${a} ^ 2 + ${b}`;
                        answer = (a * a) + b;
                    }
                    break;
                case 5:
                    a = rand(2, 5); b = rand(2, 4); c = rand(2, 6);
                    if (Math.random() > 0.5) {
                        expression = `${a} ^ ${b} × ${c}`;
                        answer = Math.pow(a, b) * c;
                    } else {
                        a = rand(2, 6); b = rand(2, 6);
                        expression = `(${a} + ${b}) ^ 2`;
                        answer = Math.pow(a + b, 2);
                    }
                    break;
                default:
                    expression = '1 + 1';
                    answer = 2;
            }
            return { expression, answer };
        }

        function refreshExample() {
            const { expression, answer } = generateExpression(currentLevel);
            expressionEl.textContent = expression;
            currentAnswer = answer;
            answerInput.value = '';
            answerInput.className = '';
            answerInput.focus();
            isLocked = false;
            streakDisplay.textContent = correctStreak;
        }

        function checkAnswer() {
            if (isLocked) return;

            // Пробуем включить музыку при первом ответе
            tryAutoPlay();

            const userAnswer = parseFloat(answerInput.value);
            if (isNaN(userAnswer) || answerInput.value.trim() === '') {
                answerInput.classList.add('error');
                setTimeout(() => answerInput.classList.remove('error'), 400);
                return;
            }

            const isCorrect = (userAnswer === currentAnswer);

            if (isCorrect) {
                answerInput.classList.remove('error');
                answerInput.classList.add('success');
                correctStreak += 1;
                updateRecord(currentLevel, correctStreak);
                isLocked = true;
                setTimeout(refreshExample, 300);
            } else {
                answerInput.classList.remove('success');
                answerInput.classList.add('error');
                correctStreak = 0;
                if (navigator.vibrate) navigator.vibrate(30);
                isLocked = true;
                setTimeout(() => {
                    answerInput.className = '';
                    answerInput.value = '';
                    answerInput.focus();
                    isLocked = false;
                    streakDisplay.textContent = correctStreak;
                }, 400);
            }
        }

        function setLevel(level) {
            if (isLocked) return;
            currentLevel = level;
            correctStreak = 0;
            levelButtons.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.level) === level);
            });
            refreshExample();
            updateRecordsDisplay();
        }

        function clearRecords() {
            if (confirm('Удалить все рекорды?')) {
                saveRecords({});
                updateRecordsDisplay();
            }
        }

        // --- СОБЫТИЯ ---
        levelButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setLevel(parseInt(btn.dataset.level));
            });
        });

        answerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        clearRecordsBtn.addEventListener('click', clearRecords);

        // Кнопка включения/выключения музыки
        playMusicBtn.addEventListener('click', toggleMusic);

        // При клике на любую область игры пробуем запустить аудио
        document.querySelector('.game-container').addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                answerInput.focus();
            }
            // Пробуем включить музыку при клике
            tryAutoPlay();
        });

        // --- СТАРТ ---
        setLevel(1);
        updateRecordsDisplay();

        // Инициализируем аудио (без воспроизведения)
        // Ждём первого клика игрока
        initAudio();

    })();
</script>

</body>
</html>
